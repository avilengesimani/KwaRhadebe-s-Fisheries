<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login | KwaRhadebe's Fisheries
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

<header class="site-header">

    <div class="container">

        <nav class="navbar">

            <a
                href="../index.html"
                class="logo"
            >
                KwaRhadebe's Fisheries
            </a>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="menu.html">
                        Menu
                    </a>
                </li>

                <li>
                    <a href="track.html">
                        Track Order
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main>

<section class="container">

    <div class="page-heading">

        <p class="eyebrow">
            Customer Account
        </p>

        <h1>
            Login
        </h1>

        <p>
            Login to manage your orders.
        </p>

    </div>


    <form
        class="card form-card"
        id="login-form"
    >

        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="example@email.com"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="Enter your password"
        >


        <button
            type="submit"
            class="btn"
        >
            Login
        </button>


        <p
            id="login-message"
            role="status"
        ></p>

    </form>

</section>

</main>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 KwaRhadebe's Fisheries
        </p>

    </div>

</footer>


<script src="../js/app.js"></script>

</body>

</html>
