<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Checkout | KwaRhadebe's Fisheries
    </title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

<header class="site-header">

    <div class="container">

        <nav class="navbar">

            <a
                href="../index.html"
                class="logo"
            >
                KwaRhadebe's Fisheries
            </a>

            <ul class="nav-links">

                <li>
                    <a href="../index.html">
                        Home
                    </a>
                </li>

                <li>
                    <a href="menu.html">
                        Menu
                    </a>
                </li>

                <li>
                    <a href="track.html">
                        Track Order
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<main>

<section class="container">

    <div class="page-heading">

        <p class="eyebrow">
            Complete Order
        </p>

        <h1>
            Checkout
        </h1>

        <p>
            Enter your delivery information
            to complete your order.
        </p>

    </div>


    <form
        class="card form-card"
        id="checkout-form"
    >

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
        >


        <label for="phone">
            Phone Number
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="Enter your phone number"
        >


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            name="address"
            required
            placeholder="Enter your delivery address"
        ></textarea>


        <label for="payment">
            Payment Method
        </label>

        <select
            id="payment"
            name="payment"
            required
        >

            <option value="">
                Select payment method
            </option>

            <option value="card">
                Card
            </option>

            <option value="online">
                Online Payment
            </option>

            <option value="cash">
                Cash on Delivery
            </option>

        </select>


        <label for="notes">
            Order Notes
        </label>

        <textarea
            id="notes"
            name="notes"
            placeholder="Additional instructions"
        ></textarea>


        <button
            type="submit"
            class="btn"
        >
            Place Order
        </button>


        <p
            id="checkout-message"
            role="status"
        ></p>

    </form>

</section>

</main>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 KwaRhadebe's Fisheries
        </p>

    </div>

</footer>


<script src="../js/app.js"></script>

</body>

</html>
